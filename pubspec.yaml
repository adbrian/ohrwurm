name: ohrwurm
description: "Offline app for learning German vocabulary by listening."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  json_schema: 5.2.2
  path: ^1.9.0
  provider: ^6.1.5
  saf_stream: ^4.0.1
  saf_util: ^3.1.0
  shared_preferences: ^2.5.5
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.2

flutter:
  uses-material-design: true

  # The manifest schema, used as it is (CLAUDE.md, rule 1).
  assets:
    - schema/manifest.v2.schema.json

  fonts:
    # Inter 4.1 (rsms/inter), SIL Open Font License 1.1: assets/fonts/OFL.txt
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
    # Phosphor icons 2.1, regular weight, MIT: assets/fonts/Phosphor-LICENSE.txt. The font file
    # from the official phosphor_flutter 2.1.0, bundled without the package, which doesn't
    # compile on Flutter 3.47 (STATUS, 2026-09-24).
    - family: Phosphor
      fonts:
        - asset: assets/fonts/Phosphor-Regular.ttf
